# cargo-deny policy. `cargo audit` only reports advisories; this adds license
# and duplicate-version policy, and bans sources other than crates.io.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib",
  "CC0-1.0", "MPL-2.0", "0BSD", "OpenSSL", "BSL-1.0",
  # Mozilla root-store data, via webpki-roots -> hyper-rustls -> reqwest.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
