name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.90.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit

      # The fuzz crate is deliberately outside the workspace and keeps its own
      # lockfile, so the audit above does not see it. It went unscanned until
      # now and had drifted onto a vulnerable `crossbeam-epoch`.
      - name: Security audit (fuzz lockfile)
        run: cargo audit -f fuzz/Cargo.lock

  miri:
    name: Miri (FFI memory safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `ves-stark-zig` holds every `unsafe` block in the workspace; the other
      # ten crates are `#![forbid(unsafe_code)]`. Miri interprets its FFI
      # boundary tests to catch null derefs, use-after-free, and mismatched
      # allocate/free pairs that ordinary test runs cannot see.
      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri on the FFI crate
        run: cargo +nightly miri test -p ves-stark-zig --all-features
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The fuzz targets live outside the workspace, so nothing else builds
      # them; without this job they bit-rot silently. This is a short smoke run
      # to keep them compiling and catch shallow crashes, not a fuzzing campaign.
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Smoke-run each fuzz target
        run: |
          set -euo pipefail
          for target in fuzz_rescue_hash fuzz_witness_validation \
                        fuzz_proof_deserialization fuzz_public_inputs fuzz_batch_proof; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -timeout=10
            echo "::endgroup::"
          done

  bench:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `cargo bench --no-run` spends >60 minutes here: the bench profile
      # optimizes the batch AIR's very large constraint evaluators at
      # opt-level=3 (see the profile comment in Cargo.toml). That cost buys
      # codegen and link verification, but this job exists to stop the benchmark
      # sources from bit-rotting — and `cargo check --benches` establishes that
      # in seconds. Type errors, signature drift, and renamed APIs are all
      # caught; only codegen/link-time failures are not, and the `check` job's
      # `clippy --all-targets` already analyzes the same bench targets.
      #
      # Run the real thing locally (`cargo bench --bench stark_bench`) when
      # measuring; CI does not produce meaningful timings on shared runners
      # anyway.
      - name: Check benchmarks compile
        run: cargo check --locked --workspace --all-features --benches

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  nodejs:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: crates/ves-stark-nodejs/package-lock.json

      - name: Install dependencies
        working-directory: crates/ves-stark-nodejs
        run: npm ci

      - name: Build native addon
        working-directory: crates/ves-stark-nodejs
        run: npm run build

      - name: Run tests
        working-directory: crates/ves-stark-nodejs
        run: npm test

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: crates/ves-stark-python/pyproject.toml

      - name: Create venv
        working-directory: crates/ves-stark-python
        run: python -m venv .venv

      - name: Install Python tooling
        working-directory: crates/ves-stark-python
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip maturin pytest

      - name: Build and install extension
        working-directory: crates/ves-stark-python
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run tests
        working-directory: crates/ves-stark-python
        run: |
          source .venv/bin/activate
          pytest -q
