[workspace]
resolver = "2"
members = [
    "crates/ves-stark-primitives",
    "crates/ves-stark-air",
    "crates/ves-stark-prover",
    "crates/ves-stark-verifier",
    "crates/ves-stark-batch",
    "crates/ves-stark-client",
    "crates/ves-stark-cli",
    "crates/ves-stark-wasm",
    "crates/ves-stark-nodejs",
    "crates/ves-stark-python",
    "crates/ves-stark-zig",
]

[package]
name = "ves-stark"
version = "0.7.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[dependencies]
ves-stark-primitives = { version = "0.7.0", path = "crates/ves-stark-primitives" }
ves-stark-air = { version = "0.7.0", path = "crates/ves-stark-air" }
ves-stark-prover = { version = "0.7.0", path = "crates/ves-stark-prover" }
ves-stark-verifier = { version = "0.7.0", path = "crates/ves-stark-verifier" }
ves-stark-client = { version = "0.7.0", path = "crates/ves-stark-client" }

[dev-dependencies]
uuid = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
winter-utils = { workspace = true }
ves-stark-batch = { version = "0.7.0", path = "crates/ves-stark-batch" }

[[bench]]
name = "stark_bench"
harness = false

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["StateSet Engineering"]
repository = "https://github.com/stateset/stateset-starks"

[workspace.dependencies]
# Winterfell STARK framework
winterfell = "0.10"
winter-air = "0.10"
winter-prover = "0.10"
winter-verifier = "0.10"
winter-math = "0.10"
winter-crypto = "0.10"
winter-utils = "0.10"

# Cryptography
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde", "js"] }
base64 = "0.22"
rand = "0.8"
rayon = "1.8"
serde_bytes = "0.11"

# Async/HTTP (for sequencer client)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Testing
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "fat"
# Release builds of this workspace take 50+ minutes from clean. Measured on
# 2026-08-31: raising codegen-units to 4 did NOT help — with fat LTO the
# serial link step dominates and parallel codegen units barely move it. The
# lever that would is `lto = "thin"`, which is a prove-time trade-off that
# should be measured with `cargo bench` before it is taken; it has not been.
codegen-units = 1
# `panic = "abort"` is deliberately NOT set.
#
# The verifier parses attacker-supplied proof bytes and public inputs. Size and
# hex validation run first (MAX_PROOF_SIZE, canonical-hex checks) and the fuzz
# targets cover deserialization, but a reachable panic anywhere on that path
# must stay recoverable: under `abort` it becomes process death, which turns a
# single malformed proof into a denial of service for a verification service and
# takes down every other in-flight request with it. Unwinding also keeps
# `catch_unwind` available to embedders and to `tests/salted_commitment_test.rs`,
# which relies on it to treat a prover panic as a sound refusal.

# Benchmark compile time was dominated by optimizing the large batch-AIR
# constraint functions at opt-level=3. Two changes make `cargo bench` tractable:
#   1. The constraint evaluators are `#[inline(never)]` (see the batch AIR), so
#      they stay separate functions instead of being merged into one giant
#      `evaluate_transition`.
#   2. This profile disables LTO and uses many codegen units, so those now-separate
#      functions are optimized in parallel across cores. (Any LTO setting forces
#      rustc back to a single serial codegen unit, which erases the benefit.)
# Benchmark numbers therefore lack cross-crate inlining; for production-accurate
# timing build against the `release` profile, which is unchanged and fully optimized.
[profile.bench]
lto = false
codegen-units = 16
